name: native
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - run: scripts/build-native.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: modules/expo-scryfall-engine/android/src/main/jniLibs

  ios:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-native.sh ios
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: modules/expo-scryfall-engine/ios/libcoqe.xcframework

  package:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: modules/expo-scryfall-engine/android/src/main/jniLibs
      - uses: actions/download-artifact@v4
        with:
          name: xcframework
          path: modules/expo-scryfall-engine/ios/libcoqe.xcframework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack (version = tag without the leading v)
        working-directory: modules/expo-scryfall-engine
        run: |
          [ "${GITHUB_REF_TYPE}" = "tag" ] && npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: modules/expo-scryfall-engine/*.tgz
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: modules/expo-scryfall-engine/*.tgz
