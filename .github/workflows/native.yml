name: native
on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the versions in the repo (run scripts/set-version.sh X.Y.Z first)
        if: github.ref_type == 'tag'
        run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Point cargo-ndk at the runner's NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - run: scripts/build-native.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: modules/expo-cardboard-compendium/android/src/main/jniLibs

  ios:
    # Optional for now: macOS arm64 runners are capacity-constrained and the job can fail to be acquired.
    # The package job still runs (without the xcframework) when this fails or is skipped.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build-native.sh ios
      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: modules/expo-cardboard-compendium/ios/libcoqe.xcframework

  package:
    needs: [android, ios]
    # run when android succeeded, even if ios failed or was cancelled by capacity problems
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: modules/expo-cardboard-compendium/android/src/main/jniLibs
      - uses: actions/download-artifact@v4
        continue-on-error: true # no xcframework when the ios job did not produce one
        with:
          name: xcframework
          path: modules/expo-cardboard-compendium/ios/libcoqe.xcframework
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack (version = tag without the leading v)
        working-directory: modules/expo-cardboard-compendium
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          fi
          npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: modules/expo-cardboard-compendium/*.tgz
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: modules/expo-cardboard-compendium/*.tgz
