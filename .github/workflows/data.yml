# Daily data publishing (docs/roadmap.md, Milestone 1). Builds coqc from this checkout, compiles Scryfall + MTGJSON data,
# verifies it, and publishes GitHub Releases: rolling `data-latest` (manifest.json + current full files) and one
# immutable `data-<run>` prerelease per run (patches). Data releases are prereleases and never "Latest".
# UNTESTED on GitHub (no runner here); scripts/test-data-pipeline.sh covers the same flow offline.
name: data
on:
  schedule:
    - cron: '0 22 * * *'   # after Scryfall's ~21:05 UTC refresh; GitHub cron is best effort, the job is idempotent
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the releases (false = dry run, files kept as a workflow artifact)'
        type: boolean
        default: true
      rebase:
        description: 'Start a new patch chain (clients download the full files)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      REBASE: ${{ inputs.rebase && '1' || '0' }}
      COQC_USER_AGENT: expo-cardboard-compendium (https://github.com/${{ github.repository }})
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - run: cargo build --release -p coqc
      - run: scripts/test-data-pipeline.sh
      - name: Build and verify the data
        run: scripts/data-build.sh
      - name: Keep the build as an artifact when not publishing
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data-stage
          path: data/stage
          retention-days: 3
      - name: Publish
        if: env.PUBLISH == 'true'
        run: scripts/data-publish.sh
